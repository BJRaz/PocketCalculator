<html>
<head>
	<title>PocketCalculator</title>
	<meta http-equiv="Pragma" content="no-cache">
	<script type="module" src="bundle.js"></script>
<script defer src="bundle.js?50dba9897a4c7abf0b2e"></script></head>
	<body>
		<h3>Pocket calculator 0.2.0</h3>
		<table border="1">
			<tr>
				<td colspan="4">
					<input type="text" id="display" value="0" />
				</td>
			</tr>
			<tr>
				<td><button id="c" class="clear">C</button></td>
				<td><button id="ca" class="clear">CA</button></td>
				<td><button id="null"></button></td>
				<td><button id="/" class="operator">/</button></td>
			</tr>
			<tr>
				<td><button id="7">7</button></td>
				<td><button id="8">8</button></td>
				<td><button id="9">9</button></td>
				<td><button id="*" class="operator">*</button></td>
			</tr>
			<tr>
				<td><button id="4">4</button></td>
				<td><button id="5">5</button></td>
				<td><button id="6">6</button></td>
				<td><button id="-" class="operator">-</button></td>
			</tr>
			<tr>
				<td><button id="1">1</button></td>
				<td><button id="2">2</button></td>
				<td><button id="3">3</button></td>
				<td><button id="+" class="operator">+</button></td>
			</tr>
			<tr>
				<td><button id="+/-">+/-</button></td>
				<td><button id="0">0</button></td>
				<td><button id=".">.</button></td>
				<td><button id="=" class="operator">=</button></td>
			</tr>
		</table>
	</body>
</html>
